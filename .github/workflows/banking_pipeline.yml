name: Banking Pipeline

# Corre mensualmente. A diferencia del pipeline diario (macro/tech/energy),
# los fundamentals bancarios vienen de SEC EDGAR 10-K/10-Q y NO cambian a
# diario — un cron mensual (dia 3, para dar margen de que los filings del
# cierre de mes esten disponibles) alcanza y sobra.
on:
  schedule:
    # Dia 3 del mes, 15:00 UTC.
    # NO usar 12:00 UTC: el daily_pipeline arranca a 10:30 UTC pero los
    # schedules de GitHub Actions demoran 30-90 min, asi que el daily
    # tipicamente termina 12:00-12:30. Si el banking arrancara a 12:00,
    # ambos podrian estar commiteando data/ en simultaneo y chocar en el
    # push. 15:00 UTC deja 2+ horas de colchon sobre el peor caso del daily.
    - cron: '0 15 3 * *'
  workflow_dispatch:

jobs:
  run-banking:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write  # commit de data/ back al repo

    steps:
      - name: Checkout fearnot-research
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run banking collectors and agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p logs
          mkdir -p data

          echo "=== Banking collector (anual, SEC EDGAR) ==="
          python banking_collector.py

          echo "=== Banking collector (trimestral, SEC EDGAR) ==="
          python banking_collector_q.py

          echo "=== Banking agent (anual) ==="
          python banking_agent.py

          echo "=== Banking agent (trimestral) ==="
          python banking_agent_q.py

      - name: Commit banking data to fearnot-research
        run: |
          git config user.name "FearNot Pipeline Bot"
          git config user.email "actions@github.com"

          git add data/*.json 2>/dev/null || true
          git add data/macro.db 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No new banking data to commit"
          else
            FECHA=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Banking pipeline run - $FECHA"
            git push
            echo "Banking data committed"
          fi

      - name: Health check (banking-only)
        if: always()
        # --banking-only valida SOLO las dos tesis bancarias del run. No mira
        # el daily (macro/tech/og + web_data.json): esos son del pipeline vecino
        # y en el día 3 tipicamente estan desalineados de fecha respecto al
        # banking. El run del 2026-08-04 con --include-banking dio falsa alarma
        # exactamente por eso.
        run: python health_check.py --banking-only
